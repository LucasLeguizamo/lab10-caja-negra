openapi: 3.1.0

info:
  title: Caja negra (reemplazo)
  version: "1.0.0"
  summary: Documentación del reemplazo de la caja negra del reto 2 (Frontier, lab 10).
  description: |
    Descripción OpenAPI del servicio HTTP que el reemplazo reproduce. Fuente: `spec/especificacion.md` (filas `ENT-*`,
    `INT-*`, `CMD-*`, `MEM-*`, `ERR-*`, `CAM-*`, `RIE-*`) y `lib/service.ts`.

    **Aviso de alcance.** Este documento describe la versión del servicio **observada hasta el id 731 del log**
    (`experimentos.jsonl`, 2026-10-10T13:00:14-0500). Lo que cuenta en la evaluación es la versión vigente a las 20:00; el log
    no cubre de 13:00:14 a 20:00 (CAM-1, CAM-5). Todo lo que no está en el log es **supuesto** y se marca así.

    **Este archivo no lo sirve el reemplazo.** El contrato del reto exige que cualquier ruta que no exista en el original
    (incluida `/openapi.yaml` o `/docs`) responda `404` `{"error":"E404","mensaje":"ruta desconocida"}`. Este YAML y
    `docs/api/*.md` son solo documentación del repositorio.

    ## Autenticación (ENT-4, ENT-5, ERR-1)

    Header `Authorization: Bearer <token>`. Las tres rutas existentes lo exigen, **incluido `GET /health`** (RIE-8).
    Sin header, `Bearer ` vacío, token inventado, esquema `Basic`, esquema `bearer` en minúscula (incluso con token
    válido) -> `401` `{"error":"E001","mensaje":"no autorizado"}`, siempre el mismo cuerpo.

    ## Orden de evaluación a nivel de ruta (ERR-15, ERR-29)

    1. Ruteo (ruta + método exactos): ruta o método no soportado -> `404` E404 **aunque no haya token** (se evalúa antes que la
       auth). Distingue mayúsculas (`/HEALTH`, `/MSG`), no normaliza la barra final (`/health/`, `/msg/`), `HEAD` da `404` con
       cuerpo vacío. El query string se ignora (`/msg?x=1` se rutea como `/msg`).
    2. Autenticación (E001) antes de leer el cuerpo.
    3. Pipeline de `POST /msg`: ver `x-error-precedence` en esa operación.

    ## Estado

    Estado por token, en memoria (cuentas, operaciones, contadores `AC-`/`OP-`). `POST /__reset` lo vacía, pero **no** reinicia
    el contador del header `X-Req` (MEM-2). El original afirma (material/README) que cada token tiene su propio estado; no se
    probó (spec, "Desconocido" de ENT). El reemplazo tiene un único estado, el del token del equipo (`TEAM_TOKEN`).

    ## Rate limit

    El material del reto dice que el original admite 10 req/s y 8.000 req/día por token y que, al excederlo, responde con el
    header `X-Frontier-Infra: rate-limit` (respuesta de infraestructura, no del servicio). Nunca apareció en el log y el
    reemplazo no lo implementa (**supuesto**; ver "Desconocido" de la sección 1 de la spec).

    ## Rutas inexistentes

    Ver `x-rutas-desconocidas` (nivel raíz) y `docs/api/rutas-inexistentes.md`.

    Los cuerpos de este documento son exactos, con sus quirks: `recieved` (typo), `"comando desconocido "` (espacio final),
    `cuentaId` / `cuenta_id` / `operacionId` (claves inconsistentes), campo opcional `sugerencia`, tildes UTF-8.
  contact:
    name: Equipo lab10-caja-negra
  x-spec-source: spec/especificacion.md
  x-log-coverage: "experimentos.jsonl version vigente ids 791-1568 (v2, tarde) + ids 1-731 (v1, manana) en tools/version_vigente.json"

servers:
  - url: https://lab10-caja-negra.vercel.app
    description: Reemplazo desplegado (un solo proceso con estado en memoria).

