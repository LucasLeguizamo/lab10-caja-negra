          efecto_estado: "Resta el monto al origen, lo suma al destino y consume un número OP. Transferir exactamente el saldo está permitido. Los fallos no consumen número de operación."
          respuesta: "200 {\"status\":\"recieved\",\"operacionId\":\"OP-0002\"}"
