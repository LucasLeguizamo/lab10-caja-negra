  schemas:
    MsgRequest:
      type: object
      description: >-
        Cuerpo de `POST /msg`. `m` = `CMD;arg1;...;argN;control`. Claves extra se ignoran (ENT-12). Cuerpo crudo <= 8192 bytes.
      required: [m]
      additionalProperties: true
      properties:
        m:
          type: string
          description: >-
            Mensaje `CMD;arg;...;control`. Control = `98 - ((100 * N) mod 97)` sobre el payload (mensaje sin el último `;control`),
            con N = concatenación decimal de dígitos y posiciones alfabéticas (A=1..Z=26) en mayúsculas; PING no lo valida.
          examples: ["PING;64", "ALTA;Lucia;82", "CONSULTA;AC-0001;14"]
      x-spec-ids: [ENT-10, ENT-12, ENT-14, INT-2]
      x-log-ids: [4, 40, 41, 145, 146]

    OkTrue:
      type: object
      description: Cuerpo de `GET /health` y `POST /__reset`.
      required: [ok]
      additionalProperties: false
      properties:
        ok:
          const: true
      x-spec-ids: [ENT-2, ENT-3]
      x-log-ids: [2, 3]

    Pong:
      type: object
      description: Respuesta de PING.
      required: [pong]
      additionalProperties: false
      properties:
        pong:
          const: true
      x-spec-ids: [CMD-1]
      x-log-ids: [4]

    AltaOk:
      type: object
      description: Respuesta de ALTA (201). Clave `cuentaId` (camelCase).
      required: [cuentaId]
      additionalProperties: false
      properties:
        cuentaId:
          type: string
          pattern: "^AC-[0-9]{4}$"
          description: "AC- + 4 dígitos con ceros, secuencial desde AC-0001 (visto hasta AC-0017; qué pasa en AC-9999 se desconoce)."
      x-spec-ids: [CMD-3, MEM-5]
      x-log-ids: [6, 108, 340, 361]

    ConsultaOk:
      type: object
      description: Respuesta de CONSULTA (200). Clave `cuenta_id` (snake_case).
      required: [cuenta_id, saldo]
      additionalProperties: false
      properties:
        cuenta_id:
          type: string
          pattern: "^AC-[0-9]{4}$"
        saldo:
          type: string
          pattern: "^-?[0-9]+\\.[0-9]{2}$"
          description: >-
            v2: string decimal de exactamente 2 cifras = centavos/100 (unidad interna = centavo; la aritmética no se reescala),
            sin separador de miles, negativo con `-` y nunca "-0.00" (0 -> "0.00"). Muestras: 0 -> "0.00" (813, 1489), 7 ->
            "0.07" (1542), -1 -> "-0.01" (1424), 12345 -> "123.45" (1540), 40000 -> "400.00" (816, 1492), 210000 -> "2100.00"
            (819, 1495), 9999999999 -> "99999999.99" (833), 10000000099 -> "100000000.99" (869), -990 -> "-9.90" (1204).
      x-spec-ids: [CMD-8, CMD-28, INT-18]
      x-log-ids: [8, 813, 819, 833, 869, 1204, 1424, 1489, 1495, 1540, 1542, 1567]

    OperacionRecibida:
      type: object
      description: Respuesta de DEPOSITO y TRANSFER (200). Typo literal `recieved`; clave `operacionId`.
      required: [status, operacionId]
      additionalProperties: false
      properties:
        status:
          const: recieved
          description: "Typo literal del original; el efecto es inmediato y síncrono."
        operacionId:
          type: string
          pattern: "^OP-[0-9]{4}$"
          description: "Un único contador compartido por DEPOSITO y TRANSFER, desde OP-0001; los fallos y ANULA no lo consumen."
      x-spec-ids: [CMD-11, CMD-16, MEM-7, RIE-3, RIE-7]
      x-log-ids: [9, 10, 204]

