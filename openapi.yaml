    {"error":"E404","mensaje":"ruta desconocida"}, con o sin token, con token válido o inválido, para cualquier método, y con o sin
    cuerpo (también con cuerpo de ~8300 bytes: 404, no 413). No lleva X-Req ni cuenta para X-Req. HEAD (sobre /msg y /health)
    da 404 con cuerpo vacío.
