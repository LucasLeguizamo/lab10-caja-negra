            - "operacion: id exacto 'OP-' + 4 dígitos de una operación existente (DEPOSITO o TRANSFER)."
          validacion: "control, aridad (E302 antes que E402), existencia de la operación."
          efecto_estado: >-
            Primera vez: revierte la operación sin comprobar fondos (el saldo puede quedar negativo). TRANSFER: devuelve el monto al
            origen y se lo quita al destino. DEPOSITO: resta el monto a la cuenta. Marca la operación como anulada. No consume
            número de operación y no hay ventana de tiempo observada (5 y 35 min). Repetida: no vuelve a tocar saldos.
          respuesta: "200 {\"ok\":true,\"anulada\":\"OP-0003\"}; repetida: 200 {\"ok\":false,\"motivo\":\"ya anulada\"} (fallo de negocio con status 200)"
          errores: [E104, E201, E202, E302, E402]
