components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        `Authorization: Bearer <token>`. El esquema se compara exacto: `bearer` en minúscula y `Basic` (incluso con un token
        válido) dan 401 E001 (ENT-4). El reemplazo acepta un único token, el de la variable de entorno `TEAM_TOKEN`.

  headers:
    X-Req:
      description: >-
        Contador por token de `POST /msg` autenticados recibidos (acumulado), como string numérico (`"21"`). Cuenta los 400 y el 413;
        no lo llevan `GET /health`, `POST /__reset`, los 401 ni los 404 de ruta. `/__reset` no lo reinicia (MEM-1 a MEM-3).
        Los headers no se comparan en la evaluación; el reemplazo lo replica por fidelidad.
      schema:
        type: string
        pattern: "^[0-9]+$"
      x-spec-ids: [MEM-1, MEM-2, MEM-3]
      x-log-ids: [24, 25, 31, 33, 40, 48, 148, 612]

  responses:
    Unauthorized:
      description: >-
        Token ausente, vacío, inválido o con esquema distinto de `Bearer` exacto. Mismo cuerpo siempre; sin `X-Req`. En
        `/msg`, la auth se evalúa antes de leer el cuerpo (cuerpo válido o no-JSON sin token -> 401) y antes del límite de tamaño.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorE001"
          examples:
            E001_sin_token:
              summary: E001 no autorizado
