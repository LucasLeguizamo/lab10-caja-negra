  x-spec-ids: [ENT-1, ENT-6, ENT-7, ENT-8, ENT-9, ERR-2, ERR-15, MEM-3]
  x-log-ids: [29, 35, 44, 45, 69, 72, 73, 74, 75, 77, 89, 90, 91, 92, 93, 103, 104, 105, 106, 574, 575, 578, 611, 613, 614, 615, 617]
  casos_observados:
    - "GET /nada, POST /nada (con y sin token): 29, 72, 73, 103, 104"
    - "GET / : 74"
    - "GET /msg, POST /health, GET /__reset: 35, 44, 45"
    - "PUT, DELETE, PATCH, OPTIONS sobre /msg: 89, 90, 91, 92, 106"
    - "mayúsculas: GET /HEALTH sin token (77) y con token inválido (105); POST /MSG con token válido (613)"
    - "barra final: GET /health/ sin token (75) y con token válido (617); POST /msg/ con token válido (611)"
    - "HEAD /msg sin token (93) y con token (615); HEAD /health con token (614): 404 con cuerpo vacío"
  no_observado:
    - "'//' (doble barra): NO observado en el log. El reemplazo (proxy.ts) responde 404 E404 sin auth por diseño; es un supuesto."
    - "'\\' en la ruta y /_next/*: NO observados en el log (proxy.ts los trata como 404 E404; supuesto)."
    - "HEAD sobre /__reset, sobre rutas inexistentes o con token inválido; OPTIONS/PUT/DELETE sobre /health y /__reset con token."
  confianza: confirmado (404 E404 y orden ruteo antes que auth); probable (HEAD /health, una muestra)

paths:
  /health:
    get:
      tags: [infra]
      operationId: getHealth
      summary: Salud del servicio (exige token)
      description: |
        `GET /health` con token válido -> `200` `{"ok":true}`. No lleva header `X-Req` y no cuenta para `X-Req` (ENT-2, MEM-3).
        Exige token como el resto de las rutas (ENT-4, RIE-8): sin token o con token inválido -> `401` E001.
        El query string se ignora (`GET /health?x=1` -> 200; probable, una muestra, ENT-19). El límite de 8192 bytes no
        aplica (ENT-20, probable).

        Otros métodos sobre `/health` (POST, HEAD, ...) son `404` E404 (ver `x-rutas-desconocidas`); `GET /health/` y `GET /HEALTH`
        también.
      x-spec-ids: [ENT-1, ENT-2, ENT-4, ENT-7, ENT-8, ENT-9, ENT-19, ENT-20, MEM-3, ERR-1, RIE-8]
      x-log-ids: [1, 2, 27, 95, 96, 97, 98, 425, 427, 576, 614, 616, 617]
      responses:
        "200":
          description: Servicio listo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkTrue"
              examples:
                ok:
                  summary: Salud con token válido
                  value:
                    ok: true
                  x-log-ids: [2, 27]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /__reset:
    post:
      tags: [infra]
      operationId: postReset
      summary: Reinicia el estado (cuentas, operaciones, contadores AC/OP)
      description: |
        `POST /__reset` con token válido -> `200` `{"ok":true}`, sin header `X-Req` (ENT-3). No necesita cuerpo; con cuerpo de
        ~8300 bytes o con query `?x=1` responde igual (una muestra cada uno: probable, ENT-3, ENT-19, ENT-20).

        Efecto (MEM-4): borra cuentas y operaciones y reinicia los contadores; tras él `ALTA` vuelve a dar `AC-0001` (saldo 0) y
        el primer `DEPOSITO`/`TRANSFER` vuelve a dar `OP-0001`. **No reinicia `X-Req`** (MEM-2). No cuenta para `X-Req` (MEM-3).

        Sin token o con token inválido -> `401` E001. `GET /__reset` -> `404` E404 (id 45).
      x-spec-ids: [ENT-1, ENT-3, ENT-4, ENT-19, ENT-20, MEM-2, MEM-3, MEM-4, ERR-1, RIE-10]
      x-log-ids: [3, 24, 47, 70, 76, 107, 122, 129, 577, 618]
      responses:
        "200":
          description: Estado reiniciado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkTrue"
              examples:
                reset:
                  summary: Reset con token válido
                  value:
                    ok: true
                  x-log-ids: [3, 24]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /msg:
    post:
      tags: [msg]
      operationId: postMsg
      summary: Ejecuta un mensaje `CMD;arg;...;control`
      description: |
        Único punto de entrada de negocio. Cuerpo JSON `{"m": "CMD;arg1;...;argN;control"}`. Todo `POST /msg` autenticado
        (incluidos los 400 y el 413) incrementa el contador del header de respuesta `X-Req` (MEM-1); los 401 y 404 de ruta no.

        ## Formato del cuerpo (ENT-10 a ENT-20)

        - Objeto JSON con la clave `m` de tipo string (en minúscula; `M` da E102). Cuerpo no-JSON, vacío, JSON válido + basura
          final, BOM al inicio o formulario real -> `400` E100. JSON válido que no es un objeto con `m` string (`{}`, `{"m":5}`,
          `{"m":null}`, `{"m":["PING;64"]}`, `[]`, `null`, `"PING;64"`) -> `400` E102.
        - **Límite de 8192 bytes** del cuerpo crudo (bytes UTF-8, cuerpo entero, no solo `m`): hasta 8192 inclusive se procesa;
          8193 o más -> `413` E101 (ENT-14). Se evalúa antes de parsear el JSON.
        - `Content-Type` se ignora (ENT-18). Claves extra en el objeto se ignoran (ENT-12). Con la clave `m` duplicada gana la
          última (ENT-16, una muestra). El query string se ignora (ENT-19).
        - Espacios, saltos de línea y tabuladores alrededor del JSON se admiten (ENT-17).

        ## Integridad y dígito de control (INT-1 a INT-17)

        El mensaje se parte por `;`: el primer segmento es el comando, el **último** es siempre el control.
        Sin ningún `;` (incluido `m` vacío o solo espacios) -> `400` E103. Cualquier segmento vacío (comando, argumento o
        control) -> `400` E104.

        Control (INT-2): `payload` = el mensaje sin el último `;` ni lo que sigue. `N` = número decimal que resulta de concatenar,
        por cada carácter del payload **en mayúsculas**, el propio dígito (`0`-`9`) o la posición de la letra en el alfabeto
        escrita en decimal (A=1 ... Z=26); el resto de caracteres (espacio, tab, `\n`, `-`, `.`, no ASCII) no aporta nada
        (INT-15). `control = 98 - ((100 * N) mod 97)` (rango 2..98). Ejemplos: `PING` -> 64; `ALTA;Lucia` -> 82;
        `CONSULTA;AC-0001` -> 14.

        - Forma (INT-7): 1 o 2 dígitos decimales sin signo, sin espacios ni decimales; si no -> `400` E201.
        - Valor (INT-3): comparación **exacta y textual** con el control calculado; `02` no equivale a `2` (-> E202).
        - **PING no valida el control** (INT-10): devuelve pong con cualquier control no vacío.
        - El nombre del comando es insensible a mayúsculas pero **no se recorta** (INT-11, INT-12). Los ids de cuenta y de
          operación se comparan exactos (INT-17).
        - El control se valida también para comandos desconocidos, antes de resolver el comando (INT-13).

        ## Comandos

        Ocho comandos: PING, ALTA, CONSULTA, DEPOSITO, TRANSFER, ANULA, HALT y NOTAS (estos dos de la versión de la tarde,
        v2). Detalle completo en `x-commands` y en `docs/api/msg.md`.

        | Comando | Firma | Aridad | Éxito |
        |---|---|---|---|
        | PING | `PING;<ctrl>` | 0 | 200 `{"pong":true}` |
        | ALTA | `ALTA;<nombre>;<ctrl>` | 1 | 201 `{"cuentaId":"AC-0001"}` |
        | CONSULTA | `CONSULTA;<cuenta>;<ctrl>` | 1 | 200 `{"cuenta_id":"AC-0001","saldo":"0.00"}` |
        | DEPOSITO | `DEPOSITO;<cuenta>;<monto>;<ctrl>` | 2 | 200 `{"status":"recieved","operacionId":"OP-0001"}` |
        | TRANSFER | `TRANSFER;<origen>;<destino>;<monto>;<ctrl>` | 3 | 200 `{"status":"recieved","operacionId":"OP-0002"}` |
        | ANULA | `ANULA;<operacion>;<ctrl>` | 1 | 200 `{"ok":true,"anulada":"OP-0003"}` o 200 `{"ok":false,"motivo":"ya anulada"}` |
        | HALT | `HALT;<confirmación>;<ctrl>` | 1 | 503 `{"error":"E599","mensaje":"service halted"}` con `1`; si no, 409 E520 |
        | NOTAS | `NOTAS;<ctrl>` | 0 | 200 `{"notas":[{"id":"N-01","texto":"…"}]}` |

        Cualquier otro nombre (con control correcto) -> `400` E301 (con espacio final en `mensaje` y, si el nombre está a distancia
        de edición <= 2 de un comando, el campo `sugerencia`).

        Monto (INT-16): entero decimal canónico de 1 a 10 dígitos ASCII, sin signo ni ceros a la izquierda, mayor que 0;
        si no -> `400` E303 (monto vacío es E104). TRANSFER: tope de 50000 por operación (E506; exento si origen y destino
        comparten el mismo nombre exacto dado en ALTA) y saldo insuficiente (E507). DEPOSITO no tiene tope (ids 832, 1490, 1502).

        ## Orden de evaluación de errores

        Ver `x-error-precedence` (ERR-29) más abajo.
